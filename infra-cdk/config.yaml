stack_name_base: juris-consult

# Admin user configuration - credentials will be created automatically
# Leandro Pereira da Silva
admin_user_email: leanpsilva@gmail.com

backend:
  agent_name: JurisAgent # Name for the agent runtime (a-z, A-Z, 0-9, _) - consulta processos judiciais
  pattern: strands-single-agent # See patterns/ for available options
  # Pattern prefix determines the frontend parser:
  #   agui-*      → AG-UI parser      (e.g. agui-strands-agent)
  #   strands-*   → Strands parser    (e.g. strands-single-agent)
  #   langgraph-* → LangGraph parser  (e.g. langgraph-single-agent)
  #   claude-*    → Claude parser     (e.g. claude-agent-sdk-single-agent)
  # The folder name must match exactly and start with the desired parser prefix.
  deployment_type: zip # Available deployment types: docker (default), zip (not supported for claude-agent-sdk)
  network_mode: PUBLIC # Available network modes: PUBLIC (default), VPC

  # Long-term memory uses a SemanticMemoryStrategy to extract and store facts across sessions.
  # This incurs additional costs: $0.75/1,000 records stored + $0.50/1,000 retrieval calls.
  # Set to true when you want to try persistent cross-session memory, which is keyed off of the
  # Cognito userId.
  use_long_term_memory: true
  ltm_top_k: 10             # Number of facts to retrieve per turn (default: 10)
  ltm_relevance_score: 0.3  # Minimum similarity threshold for retrieval (default: 0.3)

  # VPC configuration - required when network_mode is VPC
  # Your VPC must have the necessary VPC endpoints for AWS services.
  # See docs/DEPLOYMENT.md for the full list of required VPC endpoints.
  # vpc:
  #   vpc_id: vpc-0abc1234def56789a
  #   subnet_ids:
  #     - subnet-aaaa1111bbbb2222c
  #     - subnet-cccc3333dddd4444e
  #   security_group_ids:  # Optional - a default SG is created if omitted
  #     - sg-0abc1234def56789a

# Judicial case monitoring: adds a Gateway chat tool (consultar_processo_judicial)
# and a daily digest email, both backed by the public DataJud (CNJ) API.
# Omit this whole "monitoring" section to disable the feature entirely.
monitoring:
  # Email addresses that receive the daily digest via Amazon SES.
  # NOTE: Your AWS account is in SES sandbox mode, so each address below must
  # click a one-time verification link emailed by AWS after the first deploy.
  notification_emails:
    - leanpsilva@gmail.com
    - renatahellensouzagarcia@gmail.com
  # EventBridge Scheduler cron expression (UTC). 11:00 UTC = 08:00 America/Sao_Paulo.
  digest_schedule_cron: "cron(0 11 * * ? *)"
  # Judicial cases to monitor. tribunal must be a DataJud alias: tjrs or tjsc.
  # numero_processo must be the CNJ unique case number (format NNNNNNN-DD.AAAA.J.TR.OOOO).
  processes:
    - label: "Processo TJSC"
      tribunal: tjsc
      numero_processo: "5084844-64.2026.8.24.0930"
    - label: "Processo TJRS"
      tribunal: tjrs
      numero_processo: "5015749-78.2026.8.21.0008"
