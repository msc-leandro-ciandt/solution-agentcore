version: 1

# Frontend build configuration for AWS Amplify Hosting

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: "index.html"
      headers:
        - key: "Cache-Control"
          value: "public, max-age=0, s-maxage=0"
    - pattern: "/assets/*"
      headers:
        - key: "Cache-Control"
          value: "public, max-age=31536000, s-maxage=31536000, immutable"
    - pattern: "*.html"
      headers:
        - key: "Cache-Control"
          value: "public, max-age=0, s-maxage=0"
    - pattern: "**/*"
      headers:
        - key: "X-Content-Type-Options"
          value: "nosniff"
        - key: "X-Frame-Options"
          value: "SAMEORIGIN"
