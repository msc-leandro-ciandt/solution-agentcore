# Custom headers for AWS Amplify Hosting
# This configuration prevents aggressive caching of the index.html shell
# which could cause stale JavaScript and CSS to be served to users

customHeaders:
  # The main app shell (index.html) should not be cached aggressively
  # so that users always get the latest JavaScript with fixes
  - pattern: "index.html"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, s-maxage=0"
  
  # Static assets with hash in filename (Vite adds hashes automatically)
  # can be cached for a long time since they're immutable
  - pattern: "/assets/*"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, s-maxage=31536000, immutable"
  
  # Other HTML files (if any) should also not be cached
  - pattern: "*.html"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, s-maxage=0"
  
  # Security headers for all responses
  - pattern: "**/*"
    headers:
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "X-XSS-Protection"
        value: "1; mode=block"
